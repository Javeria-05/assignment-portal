name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v --junitxml=report.xml

      - name: Send report to localhost receiver
        if: always()
        run: python scripts/send_report.py